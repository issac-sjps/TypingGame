<!doctype html>
<html lang="zh-TW">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中文打字英雄大冒險</title>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="/_sdk/data_sdk.js"></script>
  <style>
    body {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100%;
      overflow: hidden;
    }

    html {
      height: 100%;
    }

    .game-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      color: #ffffff;
    }

    .screen {
      display: none;
      width: 100%;
      height: 100%;
      padding: 20px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .screen.active {
      display: flex;
      flex-direction: column;
    }

    /* 登入/註冊畫面 */
    .auth-screen {
      align-items: center;
      justify-content: center;
    }

    .auth-container {
      background: rgba(255,255,255,0.2);
      padding: 40px;
      border-radius: 15px;
      max-width: 400px;
      width: 100%;
      backdrop-filter: blur(10px);
    }

    .game-title {
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 30px;
      text-align: center;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 16px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .form-input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      background: rgba(255,255,255,0.9);
      color: #333;
      box-sizing: border-box;
    }

    .form-input:focus {
      outline: none;
      border-color: #ffd700;
      box-shadow: 0 0 10px rgba(255,215,0,0.3);
    }

    .btn {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      color: #ffffff;
      margin-bottom: 10px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }

    .btn-primary:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .btn-secondary {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    }

    .btn-secondary:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .btn-success {
      background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
    }

    .btn-success:hover {
      transform: scale(1.05);
    }

    .btn-danger {
      background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
    }

    .btn-danger:hover {
      transform: scale(1.05);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .link-button {
      background: none;
      border: none;
      color: #ffd700;
      cursor: pointer;
      text-decoration: underline;
      font-size: 14px;
      padding: 5px;
      margin-top: 10px;
    }

    .link-button:hover {
      color: #ffed4e;
    }

    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      text-align: center;
      font-weight: bold;
    }

    .message-error {
      background: rgba(245,87,108,0.3);
      border: 2px solid #f5576c;
    }

    .message-success {
      background: rgba(67,233,123,0.3);
      border: 2px solid #43e97b;
    }

    /* 主選單畫面 */
    .menu-screen {
      align-items: center;
      justify-content: center;
    }

    .menu-container {
      background: rgba(255,255,255,0.2);
      padding: 40px;
      border-radius: 15px;
      max-width: 500px;
      width: 100%;
      backdrop-filter: blur(10px);
    }

    .welcome-text {
      font-size: 24px;
      text-align: center;
      margin-bottom: 30px;
    }

    .menu-buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* 遊戲畫面 */
    .game-screen {
      padding: 15px;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      background: rgba(255,255,255,0.1);
      padding: 15px;
      border-radius: 10px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .stage-info {
      font-size: 24px;
      font-weight: bold;
    }

    .coins-info {
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .battle-area {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 20px;
      min-height: 250px;
      position: relative;
    }

    .character {
      text-align: center;
      background: rgba(255,255,255,0.15);
      padding: 20px;
      border-radius: 15px;
      min-width: 280px;
    }

    .character-avatar {
      font-size: 80px;
      margin-bottom: 10px;
    }

    .character-name {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .stats {
      text-align: left;
      font-size: 16px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      padding: 5px;
      background: rgba(0,0,0,0.2);
      border-radius: 5px;
    }

    .hp-bar {
      width: 100%;
      height: 20px;
      background: rgba(0,0,0,0.3);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 5px;
    }

    .hp-fill {
      height: 100%;
      background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
      transition: width 0.3s;
    }

    .vs-text {
      font-size: 48px;
      font-weight: bold;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
    }

    .typing-area {
      background: rgba(255,255,255,0.2);
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      margin-bottom: 20px;
    }

    .word-display {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 15px;
      min-height: 60px;
    }

    .pinyin-display {
      font-size: 24px;
      color: #ffd700;
      margin-bottom: 20px;
      min-height: 30px;
    }

    .typing-input {
      padding: 15px;
      font-size: 24px;
      border: 3px solid #ffffff;
      border-radius: 10px;
      width: 400px;
      max-width: 100%;
      text-align: center;
      background: rgba(255,255,255,0.9);
      color: #000000;
    }

    .typing-input:focus {
      outline: none;
      border-color: #ffd700;
      box-shadow: 0 0 15px rgba(255,215,0,0.5);
    }

    .weapon-info {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.2);
      padding: 15px;
      border-radius: 10px;
      max-width: 150px;
      backdrop-filter: blur(10px);
    }

    .weapon-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .weapon-effect {
      font-size: 14px;
      color: #ffd700;
    }

    .battle-log {
      background: rgba(0,0,0,0.3);
      padding: 15px;
      border-radius: 10px;
      max-height: 150px;
      overflow-y: auto;
      font-size: 14px;
      text-align: left;
    }

    .battle-log-entry {
      margin-bottom: 5px;
      padding: 5px;
      border-radius: 3px;
    }

    .battle-log-entry.player {
      background: rgba(67,233,123,0.3);
    }

    .battle-log-entry.enemy {
      background: rgba(245,87,108,0.3);
    }

    /* 商店畫面 */
    .shop-screen {
      align-items: center;
      justify-content: flex-start;
    }

    .shop-container {
      background: rgba(255,255,255,0.2);
      padding: 30px;
      border-radius: 15px;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
    }

    .shop-title {
      font-size: 36px;
      text-align: center;
      margin-bottom: 30px;
    }

    .weapons-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .weapon-card {
      background: rgba(255,255,255,0.3);
      padding: 20px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      border: 3px solid transparent;
    }

    .weapon-card:hover {
      transform: translateY(-5px);
      border-color: #ffd700;
    }

    .weapon-card.equipped {
      border-color: #f5576c;
      background: rgba(245,87,108,0.3);
    }

    .weapon-icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .weapon-card h3 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .weapon-card p {
      font-size: 14px;
      margin-bottom: 10px;
      min-height: 60px;
    }

    .upgrade-cost {
      font-size: 18px;
      color: #ffd700;
      font-weight: bold;
    }

    /* 登入紀錄畫面 */
    .records-screen {
      align-items: center;
      justify-content: flex-start;
    }

    .records-container {
      background: rgba(255,255,255,0.2);
      padding: 30px;
      border-radius: 15px;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }

    .records-title {
      font-size: 32px;
      text-align: center;
      margin-bottom: 20px;
    }

    .records-list {
      background: rgba(0,0,0,0.3);
      padding: 20px;
      border-radius: 10px;
      max-height: 400px;
      overflow-y: auto;
      margin-bottom: 20px;
    }

    .record-item {
      background: rgba(255,255,255,0.2);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .record-time {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .record-ip {
      font-size: 14px;
      color: #ffd700;
    }

    /* 失敗畫面 */
    .defeat-screen {
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .result-container {
      background: rgba(255,255,255,0.2);
      padding: 50px;
      border-radius: 15px;
    }

    .result-title {
      font-size: 48px;
      margin-bottom: 30px;
    }

    .result-message {
      font-size: 24px;
      margin-bottom: 30px;
    }

    .button-group {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* 通關畫面 */
    .victory-screen {
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .victory-title {
      font-size: 60px;
      margin-bottom: 30px;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .loading-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }

    .loading-overlay.active {
      display: flex;
    }

    .loading-spinner {
      font-size: 48px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
 </head>
 <body>
  <div class="game-container"><!-- 登入畫面 -->
   <div class="screen active" id="loginScreen">
    <div class="auth-screen">
     <div class="auth-container">
      <div class="game-title" id="gameTitle">
       中文打字英雄大冒險
      </div>
      <div id="loginMessage"></div>
      <form id="loginForm" onsubmit="return false;">
       <div class="form-group"><label class="form-label" for="loginUsername">帳號</label> <input type="text" class="form-input" id="loginUsername" required>
       </div>
       <div class="form-group"><label class="form-label" for="loginPassword">密碼</label> <input type="password" class="form-input" id="loginPassword" required>
       </div><button type="submit" class="btn btn-primary" id="loginButton">登入</button> <button type="button" class="link-button" onclick="showRegisterScreen()">還沒有帳號？點此註冊</button>
      </form>
     </div>
    </div>
   </div><!-- 註冊畫面 -->
   <div class="screen" id="registerScreen">
    <div class="auth-screen">
     <div class="auth-container">
      <div class="game-title">
       註冊新帳號
      </div>
      <div id="registerMessage"></div>
      <form id="registerForm" onsubmit="return false;">
       <div class="form-group"><label class="form-label" for="registerUsername">帳號</label> <input type="text" class="form-input" id="registerUsername" required>
       </div>
       <div class="form-group"><label class="form-label" for="registerPassword">密碼</label> <input type="password" class="form-input" id="registerPassword" required>
       </div>
       <div class="form-group"><label class="form-label" for="registerPasswordConfirm">確認密碼</label> <input type="password" class="form-input" id="registerPasswordConfirm" required>
       </div><button type="submit" class="btn btn-primary" id="registerButton">註冊</button> <button type="button" class="link-button" onclick="showLoginScreen()">已有帳號？返回登入</button>
      </form>
     </div>
    </div>
   </div><!-- 主選單畫面 -->
   <div class="screen" id="menuScreen">
    <div class="menu-screen">
     <div class="menu-container">
      <div class="game-title">
       中文打字英雄大冒險
      </div>
      <div class="welcome-text">
       歡迎回來，<span id="welcomeUsername"></span>！
      </div>
      <div class="menu-buttons"><button class="btn btn-success" onclick="startGame()">開始遊戲</button> <button class="btn btn-secondary" onclick="showRecordsScreen()">查看登入紀錄</button> <button class="btn btn-danger" onclick="resetProgress()">重置遊戲進度</button> <button class="btn btn-secondary" onclick="logout()">登出</button>
      </div>
     </div>
    </div>
   </div><!-- 遊戲畫面 -->
   <div class="screen" id="gameScreen">
    <div class="game-header">
     <div class="stage-info">
      第 <span id="currentStage">1</span> 關
     </div>
     <div class="coins-info"><span>💰</span> <span id="coinsDisplay">0</span>
     </div><button class="btn btn-secondary" onclick="openShop()" style="padding: 10px 20px; width: auto;">🛒 武器商店</button> <button class="btn btn-secondary" onclick="backToMenu()" style="padding: 10px 20px; width: auto;">返回選單</button>
    </div>
    <div class="battle-area">
     <div class="weapon-info">
      <div class="weapon-name" id="currentWeaponName">
       🗡️ 普通劍
      </div>
      <div class="weapon-effect" id="currentWeaponEffect">
       每次攻擊一次
      </div>
     </div>
     <div class="character">
      <div class="character-avatar">
       🦸
      </div>
      <div class="character-name">
       英雄
      </div>
      <div class="stats">
       <div class="stat-row"><span>❤️ 血量:</span> <span id="playerHp">100/100</span>
       </div>
       <div class="hp-bar">
        <div class="hp-fill" id="playerHpBar" style="width: 100%;"></div>
       </div>
       <div class="stat-row"><span>⚔️ 攻擊:</span> <span id="playerAttack">10</span>
       </div>
       <div class="stat-row"><span>🛡️ 防禦:</span> <span id="playerDefense">0%</span>
       </div>
       <div class="stat-row"><span>💥 爆擊:</span> <span id="playerCrit">5%</span>
       </div>
      </div>
     </div>
     <div class="vs-text">
      VS
     </div>
     <div class="character">
      <div class="character-avatar" id="enemyAvatar">
       👹
      </div>
      <div class="character-name" id="enemyName">
       妖怪
      </div>
      <div class="stats">
       <div class="stat-row"><span>❤️ 血量:</span> <span id="enemyHp">100/100</span>
       </div>
       <div class="hp-bar">
        <div class="hp-fill" id="enemyHpBar" style="width: 100%;"></div>
       </div>
       <div class="stat-row"><span>⚔️ 攻擊:</span> <span id="enemyAttack">8</span>
       </div>
       <div class="stat-row"><span>🛡️ 防禦:</span> <span id="enemyDefense">0%</span>
       </div>
       <div class="stat-row"><span>💥 爆擊:</span> <span id="enemyCrit">0%</span>
       </div>
      </div>
     </div>
    </div>
    <div class="typing-area">
     <div class="word-display" id="wordDisplay">
      準備開始...
     </div>
     <div class="pinyin-display" id="pinyinDisplay"></div><input type="text" class="typing-input" id="typingInput" placeholder="輸入中文字後按Enter">
    </div>
    <div class="battle-log" id="battleLog"></div>
   </div><!-- 商店畫面 -->
   <div class="screen" id="shopScreen">
    <div class="shop-container">
     <div class="shop-title">
      🛒 武器商店
     </div>
     <div class="coins-info" style="justify-content: center; margin-bottom: 20px; font-size: 24px;"><span>💰 剩餘金幣:</span> <span id="shopCoinsDisplay">0</span>
     </div>
     <div class="weapons-grid" id="weaponsGrid"></div><button class="btn btn-secondary" onclick="closeShop()">返回遊戲</button>
    </div>
   </div><!-- 登入紀錄畫面 -->
   <div class="screen" id="recordsScreen">
    <div class="records-container">
     <div class="records-title">
      📋 登入紀錄
     </div>
     <div class="records-list" id="recordsList"></div><button class="btn btn-secondary" onclick="backToMenu()">返回選單</button>
    </div>
   </div><!-- 失敗畫面 -->
   <div class="screen" id="defeatScreen">
    <div class="defeat-screen">
     <div class="result-container">
      <div class="result-title">
       💀 戰敗了!
      </div>
      <div class="result-message">
       別灰心，再試一次！
      </div>
      <div class="button-group"><button class="btn btn-primary" onclick="retryStage()">重新挑戰</button> <button class="btn btn-secondary" onclick="backToMenu()">返回選單</button>
      </div>
     </div>
    </div>
   </div><!-- 通關畫面 -->
   <div class="screen" id="victoryScreen">
    <div class="victory-screen">
     <div class="result-container">
      <div class="victory-title">
       🎊 恭喜通關!
      </div>
      <div class="result-message">
       你真厲害！完成了全部100關！
      </div>
      <div class="button-group"><button class="btn btn-primary" onclick="resetProgress()">重新開始</button> <button class="btn btn-secondary" onclick="backToMenu()">返回選單</button>
      </div>
     </div>
    </div>
   </div>
  </div><!-- 載入中覆蓋層 -->
  <div class="loading-overlay" id="loadingOverlay">
   <div class="loading-spinner">
    ⏳
   </div>
  </div>
  <script>
    const defaultConfig = {
      game_title: "中文打字英雄大冒險",
      login_button_text: "登入",
      register_button_text: "註冊"
    };

    const config = window.elementSdk ? window.elementSdk.config : defaultConfig;

    // 100個中文單字庫
    const wordBank = [
      {word: "學習", pinyin: "ㄒㄩㄝˊ ㄒㄧˊ"}, {word: "電腦", pinyin: "ㄉㄧㄢˋ ㄋㄠˇ"}, {word: "老師", pinyin: "ㄌㄠˇ ㄕ"}, 
      {word: "學生", pinyin: "ㄒㄩㄝˊ ㄕㄥ"}, {word: "教室", pinyin: "ㄐㄧㄠˋ ㄕˋ"}, {word: "書本", pinyin: "ㄕㄨ ㄅㄣˇ"},
      {word: "鉛筆", pinyin: "ㄑㄧㄢ ㄅㄧˇ"}, {word: "橡皮", pinyin: "ㄒㄧㄤˋ ㄆㄧˊ"}, {word: "黑板", pinyin: "ㄏㄟ ㄅㄢˇ"},
      {word: "粉筆", pinyin: "ㄈㄣˇ ㄅㄧˇ"}, {word: "課本", pinyin: "ㄎㄜˋ ㄅㄣˇ"}, {word: "作業", pinyin: "ㄗㄨㄛˋ ㄧㄝˋ"},
      {word: "考試", pinyin: "ㄎㄠˇ ㄕˋ"}, {word: "成績", pinyin: "ㄔㄥˊ ㄐㄧˋ"}, {word: "朋友", pinyin: "ㄆㄥˊ ㄧㄡˇ"},

    // 顯示訊息
    function showMessage(elementId, message, isError = false) {
      const messageEl = document.getElementById(elementId);
      messageEl.innerHTML = `<div class="message ${isError ? 'message-error' : 'message-success'}">${message}</div>`;
      setTimeout(() => {
        messageEl.innerHTML = '';
      }, 3000);
    }

    // 註冊
    async function handleRegister(e) {
      e.preventDefault();
      
      const username = document.getElementById('registerUsername').value.trim();
      const password = document.getElementById('registerPassword').value;
      const passwordConfirm = document.getElementById('registerPasswordConfirm').value;

      if (!username || !password) {
        showMessage('registerMessage', '請填寫所有欄位', true);
        return;
      }

      if (password !== passwordConfirm) {
        showMessage('registerMessage', '兩次密碼輸入不一致', true);
        return;
      }

      // 檢查帳號是否已存在
      const existingUser = allData.find(d => d.type === 'user' && d.username === username);
      if (existingUser) {
        showMessage('registerMessage', '此帳號已被註冊', true);
        return;
      }

      showLoading();

      // 創建新用戶
      const result = await window.dataSdk.create({
        type: 'user',
        username: username,
        password: password,
        currentStage: 1,
        playerMaxHp: 100,
        playerAttack: 10,
        playerDefense: 0,
        playerCritRate: 5,
        coins: 0,
        weaponId: 0,
        completedStages: '[]',
        loginTime: '',
        loginIp: ''
      });

      hideLoading();

      if (result.isOk) {
        showMessage('registerMessage', '註冊成功！請登入', false);
        setTimeout(() => {
          showLoginScreen();
        }, 1500);
      } else {
        showMessage('registerMessage', '註冊失敗，請稍後再試', true);
      }
    }

    // 登入
    async function handleLogin(e) {
      e.preventDefault();
      
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!username || !password) {
        showMessage('loginMessage', '請填寫所有欄位', true);
        return;
      }

      // 查找用戶
      const user = allData.find(d => d.type === 'user' && d.username === username && d.password === password);
      
      if (!user) {
        showMessage('loginMessage', '帳號或密碼錯誤', true);
        return;
      }

      showLoading();

      // 記錄登入時間和IP
      const loginTime = new Date().toISOString();
      const loginIp = 'Local'; // 在瀏覽器環境無法獲取真實IP

      // 創建登入紀錄
      await window.dataSdk.create({
        type: 'login_record',
        username: username,
        loginTime: loginTime,
        loginIp: loginIp,
        currentStage: user.currentStage || 1,
        playerMaxHp: user.playerMaxHp || 100,
        playerAttack: user.playerAttack || 10,
        playerDefense: user.playerDefense || 0,
        playerCritRate: user.playerCritRate || 5,
        coins: user.coins || 0,
        weaponId: user.weaponId || 0,
        completedStages: user.completedStages || '[]',
        password: ''
      });

      hideLoading();

      // 設置當前用戶
      currentUser = user;
      
      // 載入遊戲進度
      loadGameProgress();
      
      // 顯示主選單
      document.getElementById('welcomeUsername').textContent = username;
      showScreen('menuScreen');
    }

      gameState.playerMaxHp = currentUser.playerMaxHp || 100;
      gameState.playerAttack = currentUser.playerAttack || 10;
      gameState.playerDefense = currentUser.playerDefense || 0;
      gameState.playerCritRate = currentUser.playerCritRate || 5;
      gameState.coins = currentUser.coins || 0;
      gameState.weaponId = currentUser.weaponId || 0;
    }

    // 保存遊戲進度
    async function saveGameProgress() {
      if (!currentUser) return;

      showLoading();

      const updatedUser = {
        ...currentUser,
        currentStage: gameState.currentStage,
        playerMaxHp: gameState.playerMaxHp,
        playerAttack: gameState.playerAttack,
        playerDefense: gameState.playerDefense,
        playerCritRate: gameState.playerCritRate,
        coins: gameState.coins,
        weaponId: gameState.weaponId
      };

      const result = await window.dataSdk.update(updatedUser);
      
      if (result.isOk) {
        currentUser = updatedUser;
      }

      hideLoading();
    }

    function startStage(stage) {
      if (gameState.battleInterval) {
        clearInterval(gameState.battleInterval);
      }

      gameState.currentStage = stage;
      gameState.playerHp = gameState.playerMaxHp;
      gameState.enemyMaxHp = Math.floor(100 * Math.pow(1.2, stage - 1));
      gameState.enemyHp = gameState.enemyMaxHp;
      gameState.enemyAttack = Math.floor(8 * Math.pow(1.2, stage - 1));
      gameState.enemyDefense = Math.min((stage - 1) * 1, 50);
      gameState.enemyCritRate = Math.min(2 + (stage - 1) * 0.5, 100);
      gameState.weaponHitCount = 0;
      gameState.poisonStacks = 0;
      gameState.enemyDefenseReduction = 0;
      gameState.enemyAttackReduction = 0;

      updateUI();

            const input = this.value.trim();
            if (input === gameState.currentWord.word) {
              handleCorrectAnswer();
            } else {
              addBattleLog("❌ 答錯了!再試一次!", "enemy");
              this.value = '';
            }
          }
        });
      }
    });

    // 處理正確答案
    function handleCorrectAnswer() {
      gameState.coins += 5;
      addBattleLog("✅ 答對了!獲得5金幣!", "player");
      updateUI();
      saveGameProgress();
      nextWord();
    }

    // 玩家攻擊
    function playerAttack() {
      const weapon = weapons[gameState.weaponId];
      let attacks = 1;
      let damageMultiplier = 1;
      let extraEffects = [];

      gameState.weaponHitCount++;

      // 武器特效
      switch(gameState.weaponId) {
        case 1: // 雙刃劍
          if (gameState.weaponHitCount % 3 === 0) {
            attacks = 2;
            extraEffects.push("⚔️ 雙重攻擊!");
          }
          break;
        case 2: // 重錘
          damageMultiplier = 1.5;
          extraEffects.push("🔨 重擊!");
          break;
        case 3: // 毒刃
          gameState.poisonStacks++;
          extraEffects.push(`☠️ 中毒!每秒扣${gameState.poisonStacks}血`);
          break;
        case 4: // 神弓
          if (gameState.weaponHitCount % 5 === 0) {
            damageMultiplier = 5;
            extraEffects.push("🏹 強力射擊!5倍傷害!");
          }
          break;
        case 5: // 破甲劍
          if (gameState.weaponHitCount % 3 === 0) {
            gameState.enemyDefenseReduction += 5;
            extraEffects.push("🛡️ 降低敵人5%防禦!");
          }
          break;
        case 6: // 虛弱劍
          if (gameState.weaponHitCount % 3 === 0) {
            gameState.enemyAttackReduction += 2;
            extraEffects.push("⚡ 降低敵人2點攻擊!");
          }
          break;
        case 7: // 財富劍
          gameState.coins++;
          extraEffects.push("💰 額外獲得1金幣!");
          break;
        case 8: // 成長劍
          if (gameState.weaponHitCount % 5 === 0) {
            gameState.playerAttack++;
            extraEffects.push("📈 攻擊力永久+1!");
          }
          break;
        case 9: // 暴擊劍
          if (gameState.weaponHitCount % 3 === 0) {
            damageMultiplier = 2;
            extraEffects.push("💎 必定爆擊!");
          }
          break;
        case 10: // 賭徒劍
          if (Math.random() < 0.5) {
            damageMultiplier = 5;
            extraEffects.push("🎰 幸運!5倍傷害!");
          } else {
            const selfDamage = Math.floor(gameState.playerAttack * 0.5);
            gameState.playerHp = Math.max(0, gameState.playerHp - selfDamage);
            addBattleLog(`🎰 失手!打到自己造成${selfDamage}點傷害!`, "enemy");
            updateUI();

            if (gameState.playerHp <= 0) {
              handleDefeat();
            }
            return;
          }
          break;
        case 11: // 秒殺劍
          if (Math.random() < 0.03) {
            gameState.enemyHp = 0;
            addBattleLog("💀 秒殺成功!敵人被一擊擊敗!", "player");
            updateUI();
            handleStageComplete();
            return;
          }
          break;
      }

      // 執行攻擊
      for (let i = 0; i < attacks; i++) {
        let damage = gameState.playerAttack * damageMultiplier;

        const isCrit = Math.random() * 100 < gameState.playerCritRate;
        if (isCrit && gameState.weaponId !== 9) {
          damage *= 2;
          extraEffects.push("💥 爆擊!");
        }

        const effectiveDefense = Math.max(0, gameState.enemyDefense - gameState.enemyDefenseReduction);
        damage = Math.floor(damage * (100 - effectiveDefense) / 100);

        gameState.enemyHp = Math.max(0, gameState.enemyHp - damage);
        addBattleLog(`⚔️ 你造成了${damage}點傷害! ${extraEffects.join(' ')}`, "player");
        extraEffects = [];
      }

      // 毒性傷害
      if (gameState.poisonStacks > 0) {
        gameState.enemyHp = Math.max(0, gameState.enemyHp - gameState.poisonStacks);
        addBattleLog(`☠️ 毒性傷害:${gameState.poisonStacks}點`, "player");
      }

      updateUI();
    }

    // 敵人攻擊
    function enemyAttack() {
      let damage = Math.max(1, gameState.enemyAttack - gameState.enemyAttackReduction);

      const isCrit = Math.random() * 100 < gameState.enemyCritRate;
      if (isCrit) {
        damage *= 2;
      }

      const finalDamage = Math.floor(damage * (100 - gameState.playerDefense) / 100);
      gameState.playerHp = Math.max(0, gameState.playerHp - finalDamage);

      if (isCrit) {
        addBattleLog(`💥 敵人爆擊!造成${finalDamage}點傷害!`, "enemy");
      } else {
        addBattleLog(`👹 敵人攻擊!造成${finalDamage}點傷害!`, "enemy");
      }

      updateUI();
    }

    // 自動戰鬥
    function autoBattle() {
      if (gameState.enemyHp <= 0 || gameState.playerHp <= 0) {
        return;
      }

      // 玩家攻擊
      playerAttack();

      // 檢查敵人是否死亡
      if (gameState.enemyHp <= 0) {
        handleStageComplete();
        return;
      }

      // 敵人攻擊
      setTimeout(() => {
        enemyAttack();

        // 檢查玩家是否死亡
        if (gameState.playerHp <= 0) {
          handleDefeat();
        }
      }, 500);
    }

    // 關卡完成
    function handleStageComplete() {
      if (gameState.battleInterval) {
        clearInterval(gameState.battleInterval);
        gameState.battleInterval = null;
      }

      saveGameProgress();

      // 檢查是否通關100關
      if (gameState.currentStage >= 100) {
        showScreen('victoryScreen');
      } else {
        // 自動進入下一關
        gameState.currentStage++;
        setTimeout(() => {
          startStage(gameState.currentStage);
        }, 1000);
      }
    }

    // 戰敗
    function handleDefeat() {
      if (gameState.battleInterval) {
        clearInterval(gameState.battleInterval);
        gameState.battleInterval = null;
      }

      showScreen('defeatScreen');
    }

    // 重試關卡
    function retryStage() {
      startStage(gameState.currentStage);
    }

    window.retryStage = retryStage;

    // 返回選單
    function backToMenu() {
      if (gameState.battleInterval) {
        clearInterval(gameState.battleInterval);
        gameState.battleInterval = null;
      }

      saveGameProgress();
      showScreen('menuScreen');
    }

    window.backToMenu = backToMenu;

    // 開啟商店
    function openShop() {
      renderWeaponsShop();
      showScreen('shopScreen');
    }

    window.openShop = openShop;

    // 關閉商店
    function closeShop() {
      showScreen('gameScreen');
    }

    window.closeShop = closeShop;

    // 渲染武器商店
    function renderWeaponsShop() {
      const grid = document.getElementById('weaponsGrid');
      grid.innerHTML = '';

      weapons.forEach(weapon => {
        const equipped = gameState.weaponId === weapon.id;

        const card = document.createElement('div');
        card.className = `weapon-card ${equipped ? 'equipped' : ''}`;
        card.innerHTML = `
          <div class="weapon-icon">${weapon.icon}</div>
          <h3>${weapon.name}</h3>
          <p>${weapon.effect}</p>
          <div class="upgrade-cost">${equipped ? '✅ 已裝備' : `💰 ${weapon.cost} 金幣`}</div>
        `;

        if (!equipped) {
          card.onclick = () => buyWeapon(weapon.id);
        }

        grid.appendChild(card);
      });
    }

    // 購買武器
    async function buyWeapon(weaponId) {
      const weapon = weapons[weaponId];
      if (gameState.coins >= weapon.cost) {
        gameState.coins -= weapon.cost;
        gameState.weaponId = weaponId;
        updateUI();
        renderWeaponsShop();
        await saveGameProgress();
        addBattleLog(`✅ 購買並裝備了 ${weapon.name}!`, "player");
      } else {
        addBattleLog("💰 金幣不足!", "enemy");
      }
    }

    // 查看登入紀錄
    function showRecordsScreen() {
      const recordsList = document.getElementById('recordsList');
      recordsList.innerHTML = '';

      const userRecords = allData.filter(d => d.type === 'login_record' && d.username === currentUser.username);

      if (userRecords.length === 0) {
        recordsList.innerHTML = '<div style="text-align: center; padding: 20px;">目前沒有登入紀錄</div>';
      } else {
        userRecords.sort((a, b) => new Date(b.loginTime) - new Date(a.loginTime));

        userRecords.forEach(record => {
          const recordItem = document.createElement('div');
          recordItem.className = 'record-item';
          
          const loginDate = new Date(record.loginTime);
          const formattedDate = loginDate.toLocaleString('zh-TW', {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
          });

          recordItem.innerHTML = `
            <div class="record-time">🕐 ${formattedDate}</div>
            <div class="record-ip">📍 IP: ${record.loginIp}</div>
          `;

          recordsList.appendChild(recordItem);
        });
      }

      showScreen('recordsScreen');
    }

    window.showRecordsScreen = showRecordsScreen;

    // 重置遊戲進度
    async function resetProgress() {
      if (!currentUser) return;

      const confirmReset = confirm('確定要重置遊戲進度嗎？這將清除所有進度並從第一關開始！');
      if (!confirmReset) return;

      showLoading();

      gameState.currentStage = 1;
      gameState.playerMaxHp = 100;
      gameState.playerAttack = 10;
      gameState.playerDefense = 0;
      gameState.playerCritRate = 5;
      gameState.coins = 0;
      gameState.weaponId = 0;

      await saveGameProgress();

      hideLoading();

      alert('遊戲進度已重置！');
      showScreen('menuScreen');
    }

    window.resetProgress = resetProgress;

    // 戰鬥日誌
    function addBattleLog(message, type) {
      const log = document.getElementById('battleLog');
      const entry = document.createElement('div');
      entry.className = `battle-log-entry ${type}`;
      entry.textContent = message;
      log.appendChild(entry);
      log.scrollTop = log.scrollHeight;

      if (log.children.length > 10) {
        log.removeChild(log.children[0]);
      }
    }

    // 初始化
    window.addEventListener('load', function() {
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');

      if (loginForm) {
        loginForm.addEventListener('submit', handleLogin);
      }

      if (registerForm) {
        registerForm.addEventListener('submit', handleRegister);
      }

      initSDKs();
    });
