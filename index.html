<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新莊國小打字練習網</title>
    <style>
        body {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        html {
            height: 100%;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            color: white;
        }

        .school-name {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.5rem;
            opacity: 0.9;
            margin-bottom: 2rem;
        }

        .keyboard-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }

        .games-container {
            display: grid;
            /* 這裡改成 repeat(2, 1fr) 強制兩等分，形成 2x2 排列 */
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
            width: 100%;
            max-width: 800px; /* 控制最大寬度讓 2x2 視覺上更集中好看 */
            margin: 0 auto;
        }

        .game-card {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* 讓按鈕對齊底部 */
        }

        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .game-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        /* 個別卡片的頂部顏色 */
        .english-card {
            border-top: 5px solid #4CAF50;
        }

        .chinese-card {
            border-top: 5px solid #FF6B6B;
        }

        .english-game-card {
            border-top: 5px solid #00BCD4;
        }

        .chinese-game-card {
            border-top: 5px solid #FF9800;
        }

        .game-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
            color: #333;
        }

        .game-description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            flex-grow: 1; /* 讓文字區塊填滿空間，保持卡片高度一致 */
        }

        .start-button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .start-button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .footer {
            text-align: center;
            padding: 2rem;
            color: white;
            opacity: 0.8;
        }

        /* 手機版設定：螢幕寬度小於 768px 時變成單行排列 */
        @media (max-width: 768px) {
            .school-name {
                font-size: 2rem;
            }
            
            .subtitle {
                font-size: 1.2rem;
            }
            
            .container {
                padding: 1rem;
            }
            
            .games-container {
                grid-template-columns: 1fr; /* 手機版變成 1 列 */
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <header class="header">
            <div class="keyboard-icon">⌨️</div>
            <h1 class="school-name">新莊國小</h1>
            <p class="subtitle">打字練習網</p>
        </header>

        <section class="games-container">
            <div class="game-card english-card" onclick="window.open('https://issac-sjps.github.io/TypingGame/EN-Typing', '_blank')">
                <div class="game-icon">🔤</div>
                <h2 class="game-title">英文快打高手</h2>
                <p class="game-description">
                    練習英文字母和單字輸入<br>
                    提升英文打字速度和準確度
                </p>
                <button class="start-button">開始練習</button>
            </div>

            <div class="game-card chinese-card" onclick="window.open('https://issac-sjps.github.io/TypingGame/TW-Typing', '_blank')">
                <div class="game-icon">🈯</div>
                <h2 class="game-title">中文快打高手</h2>
                <p class="game-description">
                    練習中文注音和字詞輸入<br>
                    增進中文打字技巧
                </p>
                <button class="start-button">開始練習</button>
            </div>

            <div class="game-card english-game-card" onclick="window.open('https://issac-sjps.github.io/TypingGame/ENGame', '_blank')">
                <div class="game-icon">🎮</div>
                <h2 class="game-title">英文打字遊戲</h2>
                <p class="game-description">
                    趣味英文打字挑戰<br>
                    從遊戲中輕鬆學英文
                </p>
                <button class="start-button">進入遊戲</button>
            </div>

            <div class="game-card chinese-game-card" onclick="window.open('https://issac-sjps.github.io/TypingGame/CHGame', '_blank')">
                <div class="game-icon">🕹️</div>
                <h2 class="game-title">中文打字遊戲</h2>
                <p class="game-description">
                    趣味中文打字挑戰<br>
                    在挑戰中增進打字能力
                </p>
                <button class="start-button">進入遊戲</button>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>© 2024 新莊國小打字練習網 - 讓學習更有趣！</p>
    </footer>
</body>
</html>
